<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UniMe Gym — мини-апп (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFBFA;--surface:#FFFFFF;--ink:#17181C;--ink-muted:#5D5F69;--ink-meta:#33353D;--line:#E6E6E1;--hairline:#EFEFEA;
  --accent:#557546;--sage:#A9C89D;--yellow:#E2D47E;--red:#D9473F;--blue:#85AACB;--danger:#B3261E;--warn:#A86200;
  --on-ink:#FFFFFF;--dock-bg:#17181C;--dock-text:#D5D6DC;--dock-active-bg:#FFFFFF;--dock-active-ink:#17181C;
  --fig:#C7C9D0;--zone:#E4E5DF;--base:#EFEFEA;--plate:#2A2B31;--plate-ring:#A6A8B1;--scene:#9A9CA6;--card2:#F4F4F0;
  --scrim:rgba(23,24,28,.45);--shadow:rgba(23,24,28,.18);
  --font-display:'Unbounded',system-ui,sans-serif;--font-text:'Onest',system-ui,-apple-system,sans-serif;
  --r-card:22px;--r-btn:14px;--r-pill:999px;--gutter:20px;
  --top:max(env(safe-area-inset-top,0px),var(--tg-top,0px));
  --bot:max(env(safe-area-inset-bottom,0px),var(--tg-bot,0px));
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#111214;--surface:#1B1C20;--ink:#ECEDF0;--ink-muted:#9A9CA6;--ink-meta:#C3C5CC;--line:#2C2E34;--hairline:#24262B;
  --accent:#A9C89D;--on-ink:#17181C;--dock-bg:#26272C;--dock-text:#A6A8B1;--dock-active-bg:#ECEDF0;--dock-active-ink:#17181C;
  --fig:#4A4D57;--zone:#2F3138;--base:#24262B;--plate:#C9CAD2;--plate-ring:#17181C;--scene:#6B6E79;--card2:#202126;
  --red:#E5645C;--danger:#F28B82;--warn:#E8B44C;--scrim:rgba(0,0,0,.6);--shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-text);font-size:15px;line-height:1.4}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:calc(var(--top) + 14px) 0 calc(120px + var(--bot));position:relative;min-height:100vh}
.view{display:none;padding:0 var(--gutter)}.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-.01em;margin-bottom:18px}
.brand svg{width:30px;height:30px;color:var(--ink)}
.brand small{margin-left:auto;font-family:var(--font-text);font-weight:500;font-size:11px;color:var(--ink-muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px}
h1{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.01em;margin:0 0 14px}
h3{font-family:var(--font-display);font-weight:600;font-size:15px;margin:22px 0 10px}
.muted{color:var(--ink-muted)}.small{font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:7px 13px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 calc(var(--gutter)*-1);padding-left:var(--gutter);padding-right:var(--gutter);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border:0;border-radius:var(--r-btn);background:var(--ink);color:var(--on-ink);font-weight:600;font-size:15px;padding:0 16px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--accent);color:#fff}
:root[data-theme=dark] .btn.good{color:#111214}
.btn.sm{min-height:38px;font-size:13.5px;width:auto;padding:0 14px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.r{background:var(--red)}.dot.y{background:var(--yellow)}
/* streak */
.streak{background:var(--dock-bg);color:#fff;border-radius:26px;padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:16px}
:root[data-theme=dark] .streak{background:#26272C}
.streak .fl{width:58px;height:58px;border-radius:20px;background:rgba(169,200,157,.14);display:flex;align-items:center;justify-content:center;flex:none}
.streak .num{font-family:var(--font-display);font-weight:600;font-size:38px;line-height:1}
.streak .lab{font-size:13px;color:#C9CAD2;margin-top:4px}
.streak .rec{margin-left:auto;text-align:right;font-size:11.5px;color:#A6A8B1}
.streak .rec b{display:block;font-family:var(--font-display);font-size:18px;color:#fff;font-weight:600}
/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-h .t{font-family:var(--font-display);font-weight:600;font-size:19px;flex:1}
.ib{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.ib svg{width:18px;height:18px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk span{font-size:11.5px;color:var(--ink-muted);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1/1.08;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500;font-size:14px;position:relative;padding:0}
.day.out{opacity:.35}
.day.today{box-shadow:0 0 0 2px var(--ink) inset}
.day .mk{height:15px;display:flex;align-items:center;justify-content:center}
.day .mk svg{width:15px;height:15px}
.day.up{border:2px solid var(--accent)}
.day.done{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme=dark] .day.done{color:#111214}
.day.pend{background:var(--yellow);border-color:var(--yellow);color:#17181C}
.day.miss{background:rgba(179,38,30,.1);border-color:rgba(179,38,30,.35);color:var(--danger)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0 4px;font-size:12px;color:var(--ink-muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:6px;vertical-align:-1px}
/* lists */
.ex{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:18px;margin-bottom:8px;width:100%;text-align:left}
.ex .n{width:30px;height:30px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:12px;font-weight:600;flex:none}
.ex .nm{font-weight:600;font-size:15px}
.ex .sub{font-size:12.5px;color:var(--ink-muted);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--ink-muted)}
.mini{width:54px;height:54px;border-radius:14px;background:var(--card2);flex:none;overflow:hidden}
.search{width:100%;height:46px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;margin-bottom:10px;outline:none}
.search:focus{border-color:var(--ink)}
/* combos */
.combos{display:flex;gap:10px;overflow-x:auto;margin:0 calc(var(--gutter)*-1);padding:2px var(--gutter) 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.combos::-webkit-scrollbar{display:none}
.combo{flex:none;width:168px;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:13px;text-align:left}
.combo b{font-family:var(--font-display);font-size:14px;display:block;margin-bottom:4px}
.combo .ms{font-size:12px;color:var(--ink-muted);min-height:32px}
.combo .cnt{margin-top:8px;font-size:11.5px;color:var(--accent);font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.dw{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 7px;text-align:center}
.dw b{display:block;font-size:13px}.dw i{display:block;font-style:normal;font-size:10px;color:var(--ink-muted);margin-top:2px;min-height:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.dw.sel{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}.dw.sel i{color:var(--on-ink);opacity:.7}
.dw.has{border-color:var(--accent)}
.ctl{display:flex;align-items:center;gap:6px;flex:none}
.sq{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:600;padding:0}
.val{min-width:46px;text-align:center;font-weight:600;font-size:13.5px}
.pr{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* dock */
.dock-wrap{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);z-index:30;padding:12px var(--gutter) calc(14px + var(--bot));background:var(--bg);border-top:1px solid var(--hairline)}
.dock{height:60px;display:flex;gap:4px;padding:6px;border-radius:30px;background:var(--dock-bg)}
.dock button{flex:1;border:0;border-radius:24px;background:transparent;color:var(--dock-text);font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.dock button svg{width:19px;height:19px}
.dock button.on{background:var(--dock-active-bg);color:var(--dock-active-ink);font-weight:600}
/* sheets */
.sw{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sw .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.sheet{position:relative;width:min(100%,480px);max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px var(--gutter) calc(24px + var(--bot));animation:up .26s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh-h .t{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.2;flex:1}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 6px 10px;position:relative}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{display:flex;align-items:center;gap:10px;padding:0 10px;min-height:34px;font-size:13.5px}
.fig .cap b{width:24px;height:24px;border-radius:8px;background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px;margin-top:10px}
.maps figure{margin:0;text-align:center;font-size:11.5px;color:var(--ink-muted)}
.maps svg{width:100%;height:auto;max-height:260px}
.lg{display:flex;gap:14px;font-size:12.5px;margin-top:10px;flex-wrap:wrap}.lg span{display:flex;align-items:center;gap:6px}
ol.st{padding:0;margin:8px 0 0;list-style:none;counter-reset:s}
ol.st li{counter-increment:s;display:flex;gap:10px;margin-bottom:9px}
ol.st li:before{content:counter(s);width:24px;height:24px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.note{border-radius:16px;padding:11px 13px;font-size:13.5px;margin-top:10px}
.note.tip{background:rgba(169,200,157,.25)}.note.err{background:rgba(217,71,63,.1)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--bot));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:14px;font-size:13.5px;z-index:90;max-width:90%;animation:fade .2s}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{min-width:54px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;padding:0 10px}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.timer{font-family:var(--font-display);font-size:30px;text-align:center;margin:8px 0}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach div{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:12px 6px;text-align:center;font-size:11.5px}
.ach div.off{opacity:.4}.ach b{display:block;font-size:22px;margin-bottom:2px}
svg .sc{stroke:var(--scene);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg .sf{fill:var(--scene);stroke:none;opacity:.55}
.onb{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:36px var(--gutter) 40px;max-width:520px;margin:0 auto}
.onb h1{font-family:var(--font-display);font-size:26px;margin:0 0 8px}
.onb .oc{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 22px}
.onb .chip{min-height:44px;padding:9px 16px;font-size:15px}
</style>

const levelDay=(pl,m)=>{let L=0;for(const it of pl.items){const e=EM[it.id];L=Math.max(L,level(e,m))}return L};
function exRow(it,i){const e=EM[it.id];return `<button class="ex" data-ex="${e.id}"><div class="mini">${thumb(e)}</div><div class="grow"><div class="nm">${e.n}</div><div class="sub"><span class="tag">${e.eq}</span>${it.s} × ${it.r}${e.u?' '+e.u:''}</div></div>${IC.Rr.replace('<svg','<svg width="18" height="18"')}</button>`}
function thumb(e){const p=mix(e.A,e.B,.6);return `<svg viewBox="40 0 220 200" width="54" height="54">${figure(e,p)}</svg>`}

/* ===== Упражнение: анимация ===== */
function openEx(id,opt={}){const e=EM[id],hasBack=stack.length>0;
  sheet({html:()=>`
  <div class="sh-h">${hasBack?`<button class="ib" onclick="back()">${IC.L}</button>`:''}<div class="t">${e.n}<div class="row" style="margin-top:6px"><span class="tag">${e.eq}</span>${e.mach?'<span class="tag">тренажёр</span>':''}</div></div><button class="ib" onclick="closeAll()">${IC.x}</button></div>
  <div class="fig"><svg id="fg" viewBox="0 0 300 200"></svg><div class="cap"><b id="ph">1</b><span id="pt">${e.ph[0]}</span><button class="chip" style="margin-left:auto;padding:5px 12px" id="pp">⏸ пауза</button></div></div>
  <div class="lg"><span><i class="dot r"></i>основная: ${e.p.map(m=>M[m]).join(', ')}</span>${e.s.length?`<span><i class="dot y"></i>помогают: ${e.s.map(m=>M[m]).join(', ')}</span>`:''}</div>
  ${mapPair(m=>level(e,m))}
  <h3>Как делать</h3><ol class="st">${e.steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol>
  <div class="note tip">💡 ${e.tip}</div>
  ${opt.noAdd?'':`<button class="btn" style="margin-top:14px" onclick="addEx('${e.id}')">Добавить в план · ${WD[selWd]}</button>`}`,
  mount:()=>{const g=$('#fg'),per=2800;anim={id:0,pause:false,t0:performance.now(),off:0};
    const loop=now=>{if(!anim)return;const a=anim;if(!a.pause)a.t=((now-a.t0)+a.off);
      const x=(a.t||0)/per*2*Math.PI,k=.5-.5*Math.cos(x);g.innerHTML=figure(e,mix(e.A,e.B,k));
      const ph=k>.5?1:0;$('#ph').textContent=ph+1;$('#pt').textContent=e.ph[ph];a.id=requestAnimationFrame(loop)};
    anim.id=requestAnimationFrame(loop);
    $('#pp').onclick=()=>{const a=anim,b=$('#pp');if(a.pause){a.t0=performance.now()-a.t;a.off=0;a.pause=false;b.textContent='⏸ пауза'}else{a.pause=true;b.textContent='▶ играть'}}}})}
window.openEx=openEx;window.back=back;
function addEx(id){const d=plan[selWd]||(plan[selWd]={name:'',items:[]});
  if(d.items.find(i=>i.id==id)){toast('Уже в плане');return}
  d.items.push({id,s:3,r:EM[id].r0||10});if(!d.name)d.name=WD[selWd];savePlan();toast('Добавлено в '+WD[selWd])}
window.addEx=addEx;

/* ===== Библиотека ===== */
let q='',eqf='Все',mf='';
function rLib(){const eqs=['Все','Штанга','Гантели','Тренажёр','Блок','Свой вес'];
  const list=E.filter(e=>(eqf=='Все'||e.eq==eqf)&&(!mf||e.p.includes(mf)||e.s.includes(mf))&&e.n.toLowerCase().includes(q.toLowerCase()));
  $('#v-lib').innerHTML=`<h1>Упражнения</h1>
  <input class="search" id="q" placeholder="Поиск: жим, присед…" value="${q}">
  <div class="chips">${eqs.map(e=>`<button class="chip ${eqf==e?'on':''}" data-eq="${e}">${e}</button>`).join('')}</div>
  <div class="chips">${Object.entries(M).map(([k,v])=>`<button class="chip ${mf==k?'on':''}" data-m="${k}">${v}</button>`).join('')}</div>
  <div class="small muted" style="margin:2px 0 10px">${list.length} из ${E.length} · тапни — анимация и разбор</div>
  ${list.map(e=>`<button class="ex" data-ex="${e.id}"><div class="mini">${thumb(e)}</div><div class="grow"><div class="nm">${e.n}</div><div class="sub"><span class="tag">${e.eq}</span>${e.p.map(m=>`<span><i class="dot r"></i> ${M[m]}</span>`).join('')}</div></div></button>`).join('')||'<div class="card muted">Ничего не найдено</div>'}`;
  const el=$('#v-lib');el.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>openEx(b.dataset.ex));
  el.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{eqf=b.dataset.eq;rLib()});
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mf=mf==b.dataset.m?'':b.dataset.m;rLib()});
  const i=$('#q');i.oninput=()=>{q=i.value;const p=i.selectionStart;rLib();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}

/* ===== Конструктор плана ===== */
function rPlan(){const d=plan[selWd]||{name:'',items:[]},wdn=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
  $('#v-plan').innerHTML=`<h1>Мой план</h1>
  <div class="days">${WD.map((w,i)=>{const p=plan[i];return `<button class="dw ${i==selWd?'sel':''} ${p&&p.items.length?'has':''}" data-w="${i}"><b>${w}</b><i>${p&&p.items.length?(p.name||p.items.length):'—'}</i></button>`}).join('')}</div>
  <h3 style="margin-top:6px">Комбо — добавь одним тапом</h3>
  <div class="combos">${COMBOS.map(c=>`<button class="combo" data-c="${c.id}"><b>${c.n}</b><div class="ms">${c.m.map(m=>M[m]).join(' · ')}</div><div class="cnt">${c.ex.length} упражнений · +</div></button>`).join('')}</div>
  <div class="row" style="margin:14px 0 8px"><h3 style="margin:0" class="grow">${wdn[selWd]}${d.name?' · '+d.name:''}</h3>${d.items.length?'<button class="chip" id="clr">очистить</button>':''}</div>
  ${d.items.length?d.items.map((it,i)=>{const e=EM[it.id],u=e.u?5:1;return `<div class="ex" style="display:block"><div class="row"><div class="n">${i+1}</div><div class="grow" data-ex="${e.id}" style="cursor:pointer"><div class="nm">${e.n}</div><div class="sub"><span class="tag">${e.eq}</span>${e.p.map(m=>M[m]).join(', ')}</div></div><button class="sq" data-up="${i}">↑</button><button class="sq" data-rm="${i}">✕</button></div>
   <div class="pr"><span class="muted small">Подходы</span><div class="ctl"><button class="sq" data-s="${i},-1">−</button><span class="val">${it.s}</span><button class="sq" data-s="${i},1">+</button></div>
   <span class="muted small" style="margin-left:10px">${e.u||'Повторы'}</span><div class="ctl"><button class="sq" data-r="${i},${-u}">−</button><span class="val">${it.r}</span><button class="sq" data-r="${i},${u}">+</button></div></div></div>`}).join(''):'<div class="card muted">День пуст. Выбери комбо выше или добавь упражнения вручную.</div>'}
  <button class="btn alt" id="add" style="margin-top:6px">+ Добавить упражнение</button>
  ${d.items.length?`<h3>Что прокачается в этот день</h3>${mapPair(m=>levelDay(d,m))}`:''}`;
  const el=$('#v-plan');
  el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{selWd=+b.dataset.w;rPlan()});
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=COMBOS.find(x=>x.id==b.dataset.c);const dd=plan[selWd]||(plan[selWd]={name:'',items:[]});
    let n=0;for(const id of c.ex)if(!dd.items.find(i=>i.id==id)){dd.items.push({id,s:3,r:EM[id].r0||10});n++}
    if(!dd.name||dd.items.length==n)dd.name=c.n;savePlan();toast(`${c.n}: +${n} упр.`);rPlan()});
  el.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>openEx(b.dataset.ex,{noAdd:1}));
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{d.items.splice(+b.dataset.rm,1);if(!d.items.length)d.name='';savePlan();rPlan()});
  el.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;if(i>0){[d.items[i-1],d.items[i]]=[d.items[i],d.items[i-1]];savePlan();rPlan()}});
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const [i,v]=b.dataset.s.split(',').map(Number);d.items[i].s=Math.max(1,Math.min(10,d.items[i].s+v));savePlan();rPlan()});
  el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const [i,v]=b.dataset.r.split(',').map(Number);d.items[i].r=Math.max(1,Math.min(100,d.items[i].r+v));savePlan();rPlan()});
  const c=$('#clr');if(c)c.onclick=()=>{plan[selWd]={name:'',items:[]};savePlan();rPlan()};
  $('#add').onclick=pick}
let pq='',pm='';
function pick(){sheet({html:()=>`<div class="sh-h"><div class="t">Добавить в ${WD[selWd]}</div><button class="ib" onclick="closeAll()">${IC.x}</button></div>
  <input class="search" id="pq" placeholder="Поиск" value="${pq}">
  <div class="chips">${Object.entries(M).map(([k,v])=>`<button class="chip ${pm==k?'on':''}" data-m="${k}">${v}</button>`).join('')}</div><div id="pl"></div>`,
  mount:el=>{const paint=()=>{const d=plan[selWd]||{items:[]};
    $('#pl').innerHTML=E.filter(e=>(!pm||e.p.includes(pm))&&e.n.toLowerCase().includes(pq.toLowerCase())).map(e=>{const on=d.items.find(i=>i.id==e.id);
      return `<div class="ex"><div class="mini" data-i="${e.id}">${thumb(e)}</div><div class="grow" data-i="${e.id}"><div class="nm">${e.n}</div><div class="sub"><span class="tag">${e.eq}</span>${e.p.map(m=>M[m]).join(', ')}</div></div><button class="sq" style="${on?'background:var(--accent);color:#fff;border-color:var(--accent)':''}" data-a="${e.id}">${on?'✓':'+'}</button></div>`}).join('')
    $('#pl').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const id=b.dataset.a,dd=plan[selWd]||(plan[selWd]={name:'',items:[]}),ix=dd.items.findIndex(i=>i.id==id);
      if(ix>=0)dd.items.splice(ix,1);else dd.items.push({id,s:3,r:EM[id].r0||10});savePlan();paint()});
    $('#pl').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>openEx(b.dataset.i,{noAdd:1}))};
    paint();$('#pq').oninput=e=>{pq=e.target.value;paint()};
    el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{pm=pm==b.dataset.m?'':b.dataset.m;el.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.m==pm));paint()});
    }});}
const _close=closeAll;

/* ===== Профиль ===== */
const GOALS={mass:['Набор массы','💪',4,10],strength:['Сила','🏋️',5,5],cut:['Похудение','🔥',3,15],shape:['Форма','✨',3,12]};
const SCHED={1:{0:5},2:{0:5,3:5},3:{0:0,2:1,4:2},4:{0:3,1:4,3:3,4:4},5:{0:0,1:1,2:2,3:3,4:4},6:{0:0,1:1,2:2,3:0,4:1,5:2}};
function starterPlan(n,g){const [,,s,r]=GOALS[g]||GOALS.shape,o={};
  for(const [w,ci] of Object.entries(SCHED[Math.min(Math.max(n,1),6)])){const c=COMBOS[ci];o[w]={name:c.n,items:c.ex.slice(0,5).map(id=>({id,s,r}))}}return o}
function profCard(){const g=GOALS[PROFILE.goal];return `<div class="card" style="margin-bottom:12px"><div class="row"><div class="grow"><b>${g?g[1]+' '+g[0]:'Цель не выбрана'}</b><div class="small muted">${PROFILE.days_per_week?PROFILE.days_per_week+' тренировок в неделю':''}</div></div><button class="btn alt sm" onclick="onboard(true)">Изменить</button></div></div>`}
function onboard(keep){let goal=PROFILE&&PROFILE.goal&&GOALS[PROFILE.goal]?PROFILE.goal:'',days=(PROFILE&&PROFILE.days_per_week)||3;
  const el=document.createElement('div');el.className='onb';document.body.appendChild(el);
  const paint=()=>{el.innerHTML=`<h1></h1><div class="muted">Ответь на два вопроса, и я соберу стартовый план.</div>
   <h3>Какая цель?</h3><div class="oc">${Object.entries(GOALS).map(([k,v])=>`<button class="chip${goal==k?' on':''}" data-g="${k}">${v[1]} ${v[0]}</button>`).join('')}</div>
   <h3>Сколько раз в неделю?</h3><div class="oc">${[2,3,4,5,6].map(n=>`<button class="chip${days==n?' on':''}" data-d="${n}">${n}</button>`).join('')}</div>
   <button class="btn" id="onb-go" ${goal?'':'disabled style="opacity:.5"'}>${keep===true?'Сохранить':'Начать'}</button>`;
   const nm=(PROFILE&&PROFILE.first_name)||(TGW&&TGW.initDataUnsafe&&TGW.initDataUnsafe.user&&TGW.initDataUnsafe.user.first_name)||'';
   el.querySelector('h1').textContent=keep===true?'Твоя цель':(nm?'Привет, '+nm+'!':'Привет!');
   el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{goal=b.dataset.g;paint()});
   el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{days=+b.dataset.d;paint()});
   el.querySelector('#onb-go').onclick=async()=>{if(!goal)return;const body={action:'profile',goal,days_per_week:days,onboarded:true};
     if(keep!==true){plan=starterPlan(days,goal);body.plan=plan}
     try{applyServer(await api(body))}catch(e){toast('Не удалось сохранить, попробуй ещё раз');return}
     el.remove();go(keep===true?'me':'cal')}};
  paint()}
window.onboard=onboard;
function rMe(){const S=streaks(),mo=BK_.filter(b=>b.date.slice(0,7)==TK.slice(0,7)&&stOf(b)=='att').length;
  const load={};let tot=0;for(const p of Object.values(plan))for(const it of p.items){const e=EM[it.id];for(const m of e.p){load[m]=(load[m]||0)+it.s;tot+=it.s}for(const m of e.s){load[m]=(load[m]||0)+it.s*.5}}
  const mx=Math.max(1,...Object.values(load)),pl=Object.values(plan).filter(p=>p.items.length).length;
  const A=[['🔥','3 подряд',S.best>=3],['⚡','7 подряд',S.best>=7],['🏆','14 подряд',S.best>=14],['👟','Первая',S.total>=1],['💪','10 тренировок',S.total>=10],['📋','План собран',pl>=3]];
  $('#v-me').innerHTML=`<h1>Профиль</h1>
  ${LIVE&&PROFILE?profCard():''}
  <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px">
   ${[[S.cur,'серия'],[S.total,'всего'],[mo,'в этом месяце']].map(([n,l])=>`<div class="card" style="text-align:center;padding:14px 6px"><div style="font-family:var(--font-display);font-weight:600;font-size:26px">${n}</div><div class="small muted">${l}</div></div>`).join('')}</div>
  <h3>Нагрузка по плану за неделю</h3><div class="card">${Object.keys(M).map(m=>`<div class="row" style="margin:6px 0"><span class="small" style="width:118px">${M[m]}</span><div class="bar grow"><i style="width:${(load[m]||0)/mx*100}%"></i></div><span class="small muted" style="width:26px;text-align:right">${Math.round(load[m]||0)}</span></div>`).join('')}<div class="small muted" style="margin-top:8px">число подходов (вспомогательные мышцы — с коэффициентом ½)</div></div>
  <h3>Достижения</h3><div class="ach">${A.map(([i,t,o])=>`<div class="${o?'':'off'}"><b>${i}</b>${t}</div>`).join('')}</div>
  <h3>Тема</h3><div class="row"><button class="chip" id="tl">Светлая</button><button class="chip" id="td">Тёмная</button></div>`;
  $('#tl').onclick=()=>document.documentElement.dataset.theme='light';$('#td').onclick=()=>document.documentElement.dataset.theme='dark'}

/* Telegram: если открыто как Mini App */
try{const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();document.documentElement.dataset.theme=tg.colorScheme||'light'}}catch(e){}

async function boot(){
  if(LIVE){const m=$('#mode');if(m)m.remove();
    try{applyServer(await api({action:'me'}))}catch(e){$('#v-cal').classList.add('on');$('#v-cal').innerHTML='<div class="card" style="margin:20px">Не удалось загрузить данные. Закрой приложение и открой его снова из бота.</div>';return}
    if(!PROFILE.onboarded){onboard();return}}
  go('cal')}
boot();
</script></body></html>
